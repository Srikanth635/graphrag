name: Ontology NEEM offline tests

on:
  push:
    branches: [neemGraph]
    paths:
      - 'ontology_integration/**'
      - 'tests/test_ontology_*.py'
      - 'tests/test_module_builder.py'
      - 'tests/test_pipeline_contract.py'
      - 'tests/test_sqlite_neem.py'
      - 'tests/test_semantic_map.py'
      - 'tests/test_neem_*.py'
      - 'tests/test_document_ingestion.py'
      - 'tests/test_document_*.py'
      - 'tests/test_semantic_validation.py'
      - 'tests/test_entity_resolution.py'
      - '.github/workflows/ontology-neem-ci.yml'
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check rdflib pytest
      - name: Test ontology and NEEM integration
        run: |
          python -m pytest -q \
            tests/test_ontology_registry.py \
            tests/test_ontology_axioms.py \
            tests/test_module_builder.py \
            tests/test_ontology_assertions.py \
            tests/test_pipeline_contract.py \
            tests/test_sqlite_neem.py \
            tests/test_semantic_map.py \
            tests/test_neem_reconstruction.py \
            tests/test_neem_export.py \
            tests/test_neem_audit.py \
            tests/test_neem_quality_gate.py \
            tests/test_neem_identity.py \
            tests/test_neem_full_scan.py \
            tests/test_neem_ingest.py \
            tests/test_document_ingestion.py \
            tests/test_document_pipeline.py \
            tests/test_document_provider.py \
            tests/test_semantic_validation.py \
            tests/test_entity_resolution.py
